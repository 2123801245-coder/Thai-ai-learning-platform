name: Deploy Frontend

# ============================================================
# 部署架构（2026-09-21 改造）：
#
#   push main → GitHub Actions：
#     1. 镜像 push 到 Gitee（本仓库的国内镜像；GitHub→Gitee 走双方
#        机房骨干网，远快于 runner→阿里云的旧 rsync 跨海通道）
#     2. SSH 到阿里云服务器（root 密码经 secrets.SSH_PASSWORD）
#     3. 服务器执行 deploy/build-on-server.sh：
#        git pull（Gitee 镜像，国内秒级）
#        → backend/ 或 src/data/ 有变化时重建后端容器（deploy/deploy-backend.sh，
#          先备份 SQLite，健康断言失败自动回滚镜像+数据库）
#        → 非 backend/ 路径有变化时 node:20 容器内构建（npmmirror）
#        → 原子替换 /opt/thaiai/dist → 重启前端容器 → 本机验证/自动回滚
#
# 服务器首次初始化（一次性，已完成）：/opt/thaiai-src 为 git 仓库，
# origin 指向 Gitee 私有仓库（凭据内嵌于 .git/config，权限 600）。
# ============================================================

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: '只推送 Gitee 镜像，不部署'
        type: boolean
        default: false

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  GITEE_REPO: zhbedwin/thai-ai-learning-platform.git
  REMOTE_HOST: 8.140.225.225
  REMOTE_USER: root
  SITE_URL: https://thai-ai.online

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 正常路径全程分钟级；兜底余量给 Gitee 接收大 push
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 镜像仓库必须带完整历史对象，浅克隆会让 Gitee 端历史不完整
          fetch-depth: 0

      - name: Mirror push to Gitee
        run: |
          set -e
          git remote add gitee "https://${{ secrets.GITEE_USERNAME }}:${{ secrets.GITEE_TOKEN }}@gitee.com/${GITEE_REPO}"
          git push gitee --force "+refs/remotes/origin/*:refs/heads/*" --tags
          echo "镜像完成: Gitee main = $(git rev-parse origin/main)"

      - name: Setup server SSH
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_deploy == true) }}
        run: |
          set -e
          command -v sshpass >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq sshpass; }
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PASSWORD }}" | sed 's/$//' > ~/.ssh/.ssp
          chmod 600 ~/.ssh/.ssp
          ssh-keyscan -H "$REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          git config --global core.quotepath off 2>/dev/null || true

      - name: Deploy on server (git pull + frontend/backend build + verify)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_deploy == true) }}
        run: |
          set -e
          export SSHPASS="$(cat ~/.ssh/.ssp)"
          SSH="sshpass -e ssh -o ConnectTimeout=20 ${REMOTE_USER}@${REMOTE_HOST}"
          # 同步最新发布脚本到服务器（首次部署时服务器上还没有仓库代码，必须先落脚本）
          $SSH "mkdir -p /opt/thaiai-src/deploy" < /dev/null
          sshpass -e scp -o StrictHostKeyChecking=no \
            deploy/build-on-server.sh deploy/deploy-backend.sh deploy/notify.py \
            "${REMOTE_USER}@${REMOTE_HOST}:/opt/thaiai-src/deploy/"
          # THAIAI_TRIGGER 只用于发布通知里区分触发来源（Workflow / WebHook / 轮询）
          $SSH "chmod +x /opt/thaiai-src/deploy/build-on-server.sh && THAIAI_TRIGGER='GitHub Actions' bash /opt/thaiai-src/deploy/build-on-server.sh"

      - name: Public smoke check
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_deploy == true) }}
        run: |
          set -e
          CODE=""
          for i in 1 2 3; do
            CODE=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 20 "$SITE_URL/" || true)
            [ "$CODE" = "200" ] && break
            sleep 5
          done
          if [ "$CODE" = "200" ]; then
            echo "✅ 发布完成（runner 直连公网）：$SITE_URL"
            exit 0
          fi
          # runner 在海外，跨境 TLS 握手可能被 SNI 干扰重置（curl exit 35）。
          # 此时改从服务器内侧验证同一公网端点（真实证书 + vhost + 443），无跨境链路。
          echo "runner 直连失败（HTTP=$CODE），改从服务器内侧验证公网端点"
          export SSHPASS="$(cat ~/.ssh/.ssp)"
          INNER=$(sshpass -e ssh -o ConnectTimeout=20 "${REMOTE_USER}@${REMOTE_HOST}" \
            "curl -sk --resolve thai-ai.online:443:127.0.0.1 -o /dev/null -w '%{http_code}' --max-time 15 https://thai-ai.online/")
          echo "服务器内侧公网端点: HTTP $INNER"
          [ "$INNER" = "200" ] || { echo "❌ 公网端点验证失败"; exit 1; }
          echo "✅ 发布完成：$SITE_URL"

      - name: Cleanup password file
        if: always()
        run: rm -f ~/.ssh/.ssp
