<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ThaiAI · 连不上服务器</title>
    <style>
      :root { color-scheme: dark; }
      * { -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; padding: 32px; text-align: center;
        background: radial-gradient(120% 90% at 50% 0%, #0d1f1a 0%, #050807 60%);
        color: #e7f5ee;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }
      .mark {
        width: 76px; height: 76px; border-radius: 24px;
        display: grid; place-items: center;
        font-size: 34px; font-weight: 800;
        background: linear-gradient(140deg, #34d399, #0f766e);
        color: #04150f;
        box-shadow: 0 18px 40px rgba(16, 185, 129, 0.28);
      }
      h1 { margin: 4px 0 0; font-size: 20px; letter-spacing: 0.02em; }
      p { margin: 0; max-width: 22em; font-size: 14px; line-height: 1.7; color: rgba(231, 245, 238, 0.66); }
      button {
        margin-top: 6px; padding: 13px 34px; border: 0; border-radius: 999px;
        font-size: 15px; font-weight: 700; color: #04150f;
        background: linear-gradient(120deg, #6ee7b7, #34d399);
      }
      button:active { transform: scale(0.97); }
      button:disabled { opacity: 0.5; }
      .hint { font-size: 12px; color: rgba(231, 245, 238, 0.4); }
    </style>
  </head>
  <body>
    <div class="mark">ท</div>
    <h1 id="title">连不上 ThaiAI 服务器</h1>
    <p id="desc">请检查手机网络（Wi-Fi 或流量）后重试。泰语课程、AI 对话与视频都需要联网加载。</p>
    <button id="retry" type="button">重新连接</button>
    <p class="hint" id="hint"></p>

    <script>
      // 壳里加载失败会重定向到本页：给用户一个明确的出口，而不是白屏。
      // 重试直接回到主站；WebView 版本过低（Capacitor 会跳到这里）也复用同一页，
      // 因此文案分两种，其余情况按网络问题处理。
      var TARGET = "https://thai-ai.online/";
      var btn = document.getElementById("retry");
      var hint = document.getElementById("hint");
      var tries = 0;

      function isUnsupportedWebView() {
        return /unsupported webview/i.test(location.search + location.hash);
      }

      if (isUnsupportedWebView()) {
        document.getElementById("title").textContent = "系统 WebView 版本过低";
        document.getElementById("desc").textContent =
          "请到应用商店更新「Android System WebView」或升级系统后再打开 ThaiAI。";
        hint.textContent = "更新后回到本页点上面的按钮即可";
      }

      btn.addEventListener("click", function () {
        btn.disabled = true;
        btn.textContent = "正在重新连接…";
        tries += 1;
        location.replace(TARGET);
      });

      // 网络恢复时自动重试一次，省得用户盯着按钮等。
      window.addEventListener("online", function () {
        if (tries === 0) location.replace(TARGET);
      });
    </script>
  </body>
</html>
