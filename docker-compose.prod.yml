# ============================================================
# ThaiAI 生产部署（HTTPS）
#
# 使用：
#   1. 复制 .env.example 为 .env 并填好密钥
#   2. 准备证书 certs/thaiai.crt + certs/thaiai.key（阿里云证书/自签均可）
#   3. docker compose up -d --build
#
# 说明：
#   - 80 端口自动 301 跳转到 https
#   - 无域名时用自签证书可访问（浏览器有安全警告）；有域名后替换 certs/ 两个文件即可
#   - 纯 HTTP 模式：把 Dockerfile 中 nginx.conf 换回 nginx-http.conf，去掉 certs 挂载与 443 端口
# ============================================================

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_PATH: /data/users.db
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      # 语音评测（Azure Speech）
      SPEECH_KEY: ${SPEECH_KEY:-}
      SPEECH_REGION: ${SPEECH_REGION:-eastasia}
      # AI 对话（可选）
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      # 每日新闻 AI 译文（DeepSeek，可选）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      # 前端域名（CORS，部署 IP 时用 * 或具体 IP）
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # 激活码（可选）
      VIP_CODES: ${VIP_CODES:-}
    volumes:
      - ./data:/data
      - ./data/uploads:/app/backend/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # HTTPS 证书（阿里云证书或自签）：thaiai.crt + thaiai.key
      - ./certs:/etc/nginx/certs:ro

networks:
  default:
    driver: bridge
