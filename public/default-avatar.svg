<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="默认头像">
  <!--
    默认头像（ThaiAI）
    原来代码引用的 /default-avatar.png **并不存在**，于是 <img> 一直处于
    加载失败状态：Sidebar 的 onError 又把 src 指向同一个坏地址，
    页面上显示成残缺的字形碎片（截图实测）。
    这里按品牌语言补一张：墨绿底 + 金色"ไทย" + 泰式尖顶纹样。
    矢量图，任意尺寸都清晰，也不给包体增加负担。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123028"/>
      <stop offset="100%" stop-color="#07110e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6dfae"/>
      <stop offset="55%" stop-color="#e0b061"/>
      <stop offset="100%" stop-color="#a97c33"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#6ee7a8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#6ee7a8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="48" cy="48" r="48" fill="url(#bg)"/>
  <circle cx="48" cy="48" r="48" fill="url(#glow)"/>
  <circle cx="48" cy="48" r="45" fill="none" stroke="rgba(110,231,168,0.35)" stroke-width="1.5"/>

  <!-- 泰式尖顶（与侧边栏 Logo 同源意象） -->
  <path d="M48 14 L70 24 L68 27.5 L48 19.5 L28 27.5 L26 24 Z" fill="url(#gold)" opacity="0.55"/>
  <path d="M48 22 L63 29 L61.5 32 L48 26 L34.5 32 L33 29 Z" fill="url(#gold)" opacity="0.33"/>

  <!-- 核心泰文 -->
  <text x="48" y="62" text-anchor="middle"
        font-family="'Noto Sans Thai', 'Tahoma', system-ui, sans-serif"
        font-size="30" font-weight="700" fill="url(#gold)">ไทย</text>
</svg>
