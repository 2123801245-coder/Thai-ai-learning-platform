<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    favicon.svg · ThaiAI 品牌图标（PNG 版的矢量近似，同构）

    主品牌资产是 public/brand/thaiai-logo*.png（金色神庙 + 泰国国旗色飘带）。
    这里保留一份几何近似版作为 SVG favicon 兜底：不支持 PNG favicon 的
    环境（极少）或需要无损缩放的场景用。
    结构：米白圆角底 → 金色帕侬神庙（含裙楼） → 泰国国旗色三色飘带 → 金色花饰。
  -->
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF4"/>
      <stop offset="1" stop-color="#F3EDDF"/>
    </linearGradient>
    <linearGradient id="fgold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6D365"/>
      <stop offset="0.55" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="fnavy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3A67"/>
      <stop offset="1" stop-color="#1A2547"/>
    </linearGradient>
  </defs>

  <!-- 圆角米白底（App 图标版式的底） -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#fbg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.35"/>

  <!-- 背景日轮 + 远景塔影 -->
  <circle cx="32" cy="27" r="19" fill="#F0E3C4"/>
  <path d="M14 40 L17 24 L19 40 Z M45 40 L48 25 L50 40 Z" fill="#E5D3A8" opacity="0.8"/>

  <!-- 中央神庙：塔尖针 → 层叠塔身 → 裙楼 -->
  <circle cx="32" cy="10.5" r="1.1" fill="url(#fgold)"/>
  <path d="M32 11.5 L33.4 17 L32.8 17.6 L32 16.8 L31.2 17.6 L30.6 17 Z" fill="url(#fgold)"/>
  <path d="M32 17.5 L34.2 25 L29.8 25 Z" fill="url(#fgold)"/>
  <!-- 主殿（navy 屋顶 + 金色山墙） -->
  <path d="M24.5 25 L32 21 L39.5 25 L39.5 27 L24.5 27 Z" fill="url(#fnavy)"/>
  <path d="M32 21.2 L35.8 27.5 L28.2 27.5 Z" fill="url(#fgold)"/>
  <rect x="26.5" y="27" width="11" height="8.5" fill="url(#fgold)"/>
  <path d="M32 29.5 C33.8 29.5 34.5 31 34.5 32.5 L34.5 35.5 L29.5 35.5 L29.5 32.5 C29.5 31 30.2 29.5 32 29.5 Z" fill="#8A6508"/>
  <!-- 两侧裙楼 -->
  <path d="M19 28 L24.5 25.5 L24.5 27.5 L19 30 Z" fill="url(#fnavy)"/>
  <path d="M45 28 L39.5 25.5 L39.5 27.5 L45 30 Z" fill="url(#fnavy)"/>
  <rect x="19.5" y="29.5" width="5" height="6" fill="url(#fgold)"/>
  <rect x="39.5" y="29.5" width="5" height="6" fill="url(#fgold)"/>

  <!-- 泰国国旗色三色飘带 -->
  <path d="M12 39 Q24 33 40 37.5 Q50 40.5 53 35.5 L53 38 Q50 43.5 40 40.5 Q24 36 12 42 Z" fill="#A51931" transform="translate(0,-1.2)"/>
  <path d="M12 39 Q24 33 40 37.5 Q50 40.5 53 35.5 L53 37.4 Q50 43 40 40 Q24 35.6 12 41.6 Z" fill="#F4F5F8" transform="translate(0,0.4)"/>
  <path d="M12 39.4 Q24 33.4 40 37.9 Q50 40.9 53 35.9 L53 39.4 Q50 44.9 40 41.9 Q24 37.5 12 43.5 Z" fill="#2D2A4A"/>

  <!-- 金色花饰（字标 i 上的点） -->
  <g transform="translate(32 51)">
    <circle cx="0" cy="-2.6" r="1.2" fill="url(#fgold)"/>
    <circle cx="2.4" cy="-1" r="1.2" fill="url(#fgold)"/>
    <circle cx="1.5" cy="1.8" r="1.2" fill="url(#fgold)"/>
    <circle cx="-1.5" cy="1.8" r="1.2" fill="url(#fgold)"/>
    <circle cx="-2.4" cy="-1" r="1.2" fill="url(#fgold)"/>
    <circle cx="0" cy="0" r="1.1" fill="#F3EDDF"/>
  </g>
</svg>
