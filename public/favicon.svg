<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B241F"/>
      <stop offset="1" stop-color="#04110F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6D365"/>
      <stop offset="0.55" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#B88A20"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.7"/>
  <!-- 泰式尖顶 (prang) -->
  <path d="M32 8 L36 16 L34 15 L33 20 L35 19 L32 26 L29 19 L31 20 L30 15 L28 16 Z" fill="url(#gold)"/>
  <!-- 尖顶基座 -->
  <path d="M26 22 L38 22 L36 28 L28 28 Z" fill="url(#emerald)" opacity="0.9"/>
  <!-- 金环（AI 光环） -->
  <circle cx="32" cy="38" r="9" fill="none" stroke="url(#gold)" stroke-width="2.2" opacity="0.95"/>
  <!-- AI 核心节点 -->
  <circle cx="32" cy="38" r="4.2" fill="url(#emerald)"/>
  <circle cx="32" cy="38" r="4.2" fill="none" stroke="#A7F3D0" stroke-width="0.8" opacity="0.8"/>
  <!-- 泰文 ส 点缀 -->
  <text x="24" y="52" font-size="10" fill="url(#gold)" opacity="0.65" font-family="serif">ส</text>
  <text x="36" y="53" font-size="8" fill="#34D399" opacity="0.55" font-family="serif">ญ</text>
</svg>
