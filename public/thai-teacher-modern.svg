<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- 背景渐变：深墨绿 → 翠绿 -->
    <radialGradient id="bg" cx="38%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#123B32"/>
      <stop offset="55%" stop-color="#0B241F"/>
      <stop offset="100%" stop-color="#071713"/>
    </radialGradient>
    <!-- 人物光晕 -->
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#10B981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <!-- 面部肤色 -->
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8D9B8"/>
      <stop offset="100%" stop-color="#F0C39A"/>
    </linearGradient>
    <!-- 头发渐变 -->
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2B2430"/>
      <stop offset="100%" stop-color="#17121C"/>
    </linearGradient>
    <!-- 上衣 -->
    <linearGradient id="dress" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <!-- 泰金 -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6D365"/>
      <stop offset="55%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B88A20"/>
    </linearGradient>
    <!-- 耳机 -->
    <linearGradient id="headset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- 背景圆 -->
  <circle cx="200" cy="200" r="200" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="200" fill="url(#glow)"/>

  <!-- 细金色内环 -->
  <circle cx="200" cy="200" r="186" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.35"/>

  <!-- 星尘 -->
  <circle cx="92" cy="120" r="2.2" fill="#F6D365" opacity="0.7"/>
  <circle cx="318" cy="96" r="1.8" fill="#34D399" opacity="0.8"/>
  <circle cx="330" cy="240" r="2" fill="#F6D365" opacity="0.5"/>
  <circle cx="74" cy="262" r="1.6" fill="#A7F3D0" opacity="0.6"/>
  <circle cx="150" cy="80" r="1.5" fill="#F6D365" opacity="0.4"/>

  <!-- 肩部 -->
  <path d="M 96 360 C 110 292 150 262 200 262 C 250 262 290 292 304 360 Z" fill="url(#dress)"/>
  <!-- 领口金线 -->
  <path d="M 168 262 C 182 276 218 276 232 262" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.85"/>

  <!-- 颈部 -->
  <path d="M 186 216 C 186 240 214 240 214 216 L 214 262 C 214 274 186 274 186 262 Z" fill="url(#skin)"/>
  <path d="M 186 236 C 186 252 214 252 214 236" fill="none" stroke="#E8B98C" stroke-width="2" opacity="0.55"/>

  <!-- 头发（后层） -->
  <path d="M 130 196 C 128 122 156 88 200 88 C 244 88 272 122 270 196 C 272 238 262 272 246 290 C 240 296 226 294 224 286 C 214 270 208 258 200 258 C 192 258 186 270 176 286 C 174 294 160 296 154 290 C 138 272 128 238 130 196 Z" fill="url(#hair)"/>

  <!-- 刘海 -->
  <path d="M 132 178 C 138 118 164 92 200 92 C 236 92 262 118 268 178 C 250 158 228 150 200 150 C 172 150 150 158 132 178 Z" fill="url(#hair)" opacity="0.95"/>

  <!-- 面部 -->
  <ellipse cx="200" cy="196" rx="60" ry="66" fill="url(#skin)"/>

  <!-- 脸颊光 -->
  <ellipse cx="172" cy="208" rx="12" ry="8" fill="#F0A87E" opacity="0.25"/>
  <ellipse cx="228" cy="208" rx="12" ry="8" fill="#F0A87E" opacity="0.25"/>

  <!-- 眉毛 -->
  <path d="M 158 172 C 166 166 178 165 184 169" fill="none" stroke="#3A2E28" stroke-width="4" stroke-linecap="round"/>
  <path d="M 216 169 C 222 165 234 166 242 172" fill="none" stroke="#3A2E28" stroke-width="4" stroke-linecap="round"/>

  <!-- 眼睛 -->
  <ellipse cx="171" cy="188" rx="7" ry="8.5" fill="#FFFFFF"/>
  <ellipse cx="229" cy="188" rx="7" ry="8.5" fill="#FFFFFF"/>
  <circle cx="171" cy="189" r="4.4" fill="#1F2937"/>
  <circle cx="229" cy="189" r="4.4" fill="#1F2937"/>
  <circle cx="173" cy="187" r="1.6" fill="#FFFFFF"/>
  <circle cx="231" cy="187" r="1.6" fill="#FFFFFF"/>

  <!-- 微笑 -->
  <path d="M 184 216 C 190 223 210 223 216 216" fill="none" stroke="#B4604E" stroke-width="4" stroke-linecap="round"/>

  <!-- 鼻线 -->
  <path d="M 200 196 C 199 204 199 208 201 210" fill="none" stroke="#E8B98C" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- 金色耳环 -->
  <circle cx="138" cy="210" r="5" fill="url(#gold)"/>
  <circle cx="262" cy="210" r="5" fill="url(#gold)"/>

  <!-- 额头金色点饰 -->
  <circle cx="200" cy="140" r="2.6" fill="url(#gold)" opacity="0.9"/>

  <!-- 发丝光 -->
  <path d="M 168 104 C 182 94 200 90 214 94" fill="none" stroke="#F6D365" stroke-width="2" stroke-linecap="round" opacity="0.35"/>

  <!-- AI 耳机 -->
  <g>
    <circle cx="200" cy="88" r="14" fill="url(#headset)" opacity="0.95"/>
    <path d="M 200 74 C 178 74 162 88 162 108 L 162 118" fill="none" stroke="url(#headset)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 200 74 C 222 74 238 88 238 108 L 238 118" fill="none" stroke="url(#headset)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="162" cy="122" r="5" fill="url(#gold)"/>
    <circle cx="238" cy="122" r="5" fill="url(#gold)"/>
    <circle cx="200" cy="88" r="5" fill="#0B241F"/>
    <circle cx="200" cy="88" r="2.2" fill="#34D399"/>
  </g>

  <!-- AI 光环 -->
  <circle cx="200" cy="88" r="22" fill="none" stroke="#34D399" stroke-width="1.5" opacity="0.5" stroke-dasharray="4 6"/>
</svg>
