<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="AI驱动的泰语学习平台，融合视频课程、词汇、口语与AI对话。"
    />

    <!--
      分享卡片（微信 / Twitter / Facebook 等抓取）
      ------------------------------------------------------------
      og:image / og:url **必须**是绝对 URL：抓取器不会替我们补域名，
      相对路径分享出去就是一张空图。%SITE_URL% 是占位符，由 vite.config.js
      里的 thaiai-share-meta 插件按 .env 的 VITE_SITE_URL 替换（dev 与 build 都替换）。
      下面这段还缺少「按页面区分卡片」的能力 —— 那是公开路由落地页的事，
      由 scripts/build-share-pages.mjs 在构建末尾为 /login、/share、/thai-landing
      各生成一份带自己标题与卡片的 HTML（nginx 的 try_files 会自动命中）。
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ThaiAI" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="ThaiAI · Learn Thai with AI" />
    <meta
      property="og:description"
      content="AI 泰语老师：对话陪练 · 文化宇宙 · 每日学习闭环，从发音到自由对话。"
    />
    <meta property="og:image" content="%SITE_URL%/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ThaiAI · AI 泰语学习平台" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ThaiAI · Learn Thai with AI" />
    <meta
      name="twitter:description"
      content="AI 泰语老师：对话陪练 · 文化宇宙 · 每日学习闭环。"
    />
    <meta name="twitter:image" content="%SITE_URL%/brand/og-image.png" />

    <meta
      name="theme-color"
      content="#061312"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="64x64"
      href="/brand/thaiai-logo-64.png"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/brand/thaiai-logo-180.png"
    />

    <!-- PWA：Android/Chrome 的「添加到主屏幕」用 manifest 里的 192/512 图标；
         iOS 只认上面的 apple-touch-icon，加上这几个 name 让独立窗口不带浏览器外壳。 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ThaiAI" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />


    <!--
      主题引导（阻塞式，必须在 React 挂载前跑）
      ------------------------------------------------------------
      问题：主题变量是 React 的 useEffect 里写上去的，所以刷新页面时
      会先按默认世界绘一帧，再跳到用户真正选的世界 —— 明显的白闪/黑闪。
      实测过：PAPER 用户每次刷新都会看到一瞬深色。

      这里在 <head> 里同步读 localStorage，把 data-visual-mode 和底色
      在**首次绘制之前**就定下来。只设背景色与一个标记，不写整套变量
      （完整变量仍由 ThemeContext 负责，避免两处定义漂移）。

      用 try/catch 包住：localStorage 在隐私模式/禁用 Cookie 时会抛异常，
      不能因为读主题失败就让整个应用白屏。
    -->
    <script>
      /*
       * 首屏底色引导（防闪烁）。
       *
       * 主题只有深色/浅色两种（见 src/lib/ThemeContext.jsx），所以这里也只剩两个
       * 值：深色 = 午夜世界 #050807，浅色 = 纸本世界 #F6F1E6。这段必须在 React
       * 挂载前同步跑，所以没法 import 模块 —— 改 worlds.js 的 midnight/paper 底色
       * 时，记得同步这里。
       */
      (function () {
        try {
          var mode = localStorage.getItem("thaiAI_mode");
          if (mode !== "dark" && mode !== "light") {
            mode = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }

          var light = mode === "light";
          var bg = light ? "#F6F1E6" : "#050807";
          var root = document.documentElement;

          root.setAttribute("data-visual-mode", light ? "paper" : "midnight");
          root.setAttribute("data-mode", mode);
          root.classList.toggle("dark", !light);
          root.style.backgroundColor = bg;

          /* 让浏览器 UI（地址栏）也跟着变 */
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", bg);
        } catch (e) {
          /* 读不到就用深色，不影响任何功能 */
        }
      })();
    </script>

    <link rel="preload" href="/fonts/fonts.css" as="style">
    <link rel="stylesheet" href="/fonts/fonts.css">
    <title>ThaiAI · AI泰语学习平台</title>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
