# ============================================================
# ThaiAI nginx 站点配置（HTTPS）
#
# 证书放在容器内 /etc/nginx/certs/（docker-compose 挂载 ./certs）：
#   thaiai.crt  /  thaiai.key
# 用 certbot 自动签发后，把证书复制到 ./certs/ 即可。
# ============================================================

# 后端服务（docker-compose 网络内）
upstream thaiai_backend {
    server thaiai_backend:3001;
}

# ---- HTTP → HTTPS 强制跳转 ----
server {
    listen 80;
    server_name thai-ai.online _;

    # ACME 验证路径（certbot 自动续期用，可放开）
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS 主站点 ----
server {
    listen 443 ssl;
    http2 on;
    server_name thai-ai.online _;
    root /usr/share/nginx/html;

    ssl_certificate     /etc/nginx/certs/thaiai.crt;
    ssl_certificate_key /etc/nginx/certs/thaiai.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # 上传头像等大请求
    client_max_body_size 10m;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 静态安全头（API 响应头由后端 helmet 负责）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---------- API 反代 ----------
    location /api/ {
        proxy_pass http://thaiai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 易支付回调/长请求不超时
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /videos/ {
        proxy_pass http://thaiai_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 视频支持 Range 拖动进度条
        proxy_buffering off;
    }

    location /subtitles/ {
        proxy_pass http://thaiai_backend;
        proxy_set_header Host $host;
    }

    location /uploads/ {
        proxy_pass http://thaiai_backend;
        proxy_set_header Host $host;
        # 头像图片缓存 7 天
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------- Gitee WebHook（第二条发布通道） ----------
    # Gitee push 到 main → 本端点（验签后触发服务器自行发布，见 deploy/gitee-webhook.py）。
    # 服务只监听 127.0.0.1:9911，这里是唯一的公网入口；只收 POST。
    location = /hooks/gitee {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:9911;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 后端立即回 200，发布在后台跑；给足握手与响应时间
        proxy_read_timeout 20s;
    }

    # ---------- 前端静态资源 ----------
    # 带内容哈希的构建产物：长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 公开图片（/covers、/thai-*.jpg 等）：短缓存
    location ~* \.(jpg|jpeg|png|webp|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 课文音频（AAC/M4A）：显式 types 兜底（基础镜像 mime.types 缺 m4a 时会以
    # application/octet-stream 下发，Safari/WebView 拒播）；长缓存让复听不再重新下载。
    # 音频不在 /assets 下，否则会落到 location / 的 no-cache（每次复听都重下 ~700KB）。
    location ~* \.m4a$ {
        types {
            audio/mp4 m4a;
        }
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA 路由回退：index.html 不缓存（哈希文件名旧引用会 404 白屏）
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
