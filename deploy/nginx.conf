# ============================================================
# ThaiAI nginx 站点配置（HTTPS）
#
# 证书放在容器内 /etc/nginx/certs/（docker-compose 挂载 ./certs）：
#   thaiai.crt  /  thaiai.key
# 用 certbot 自动签发后，把证书复制到 ./certs/ 即可。
# ============================================================

# 后端服务（docker-compose 网络内）
upstream thaiai_backend {
    server backend:3001;
}

# ---- HTTP → HTTPS 强制跳转 ----
server {
    listen 80;
    server_name _;

    # ACME 验证路径（certbot 自动续期用，可放开）
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS 主站点 ----
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/thaiai.crt;
    ssl_certificate_key /etc/nginx/certs/thaiai.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # 上传头像等大请求
    client_max_body_size 10m;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 静态安全头（API 响应头由后端 helmet 负责）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---------- API 反代 ----------
    location /api/ {
        proxy_pass http://thaiai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 易支付回调/长请求不超时
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /videos/ {
        proxy_pass http://thaiai_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 视频支持 Range 拖动进度条
        proxy_buffering off;
    }

    location /subtitles/ {
        proxy_pass http://thaiai_backend;
        proxy_set_header Host $host;
    }

    location /uploads/ {
        proxy_pass http://thaiai_backend;
        proxy_set_header Host $host;
        # 头像图片缓存 7 天
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------- 前端静态资源 ----------
    # 带内容哈希的构建产物：长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 公开图片（/covers、/thai-*.jpg 等）：短缓存
    location ~* \.(jpg|jpeg|png|webp|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
